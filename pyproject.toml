[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adsayi-statedrift"
version = "0.1.0"
description = "比对状态快照与后端实际状态，标出已经失真的字段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "adsayi" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://adsayi.github.io"
Repository = "https://github.com/adsayi/statedrift"
Issues = "https://github.com/adsayi/statedrift/issues"

[project.scripts]
statedrift = "statedrift:main"

[tool.setuptools]
py-modules = ["statedrift"]
